<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT-TEC // БУНКЕР</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
</head>
<body class="has-header">

<!-- HEADER -->
<header class="site-header">
  <a href="/" class="header-logo">
    <span class="logo-badge">☢</span>
    <div>
      <div class="logo-corp">VAULT-TEC CORPORATION</div>
      <div class="logo-name">БУНКЕР</div>
    </div>
  </a>
  <nav class="header-nav">
    <a href="/" class="nav-link active">🏠 ГОЛОВНА</a>
    <a href="/rules" class="nav-link">📖 ПРАВИЛА</a>
    <a href="/about" class="nav-link">ℹ ПРО ГРУ</a>
    <div class="nav-sep"></div>
    <span class="nav-user">// мешканець: <span>{{ username }}</span></span>
    <button class="nav-logout" onclick="doLogout()">ВИЙТИ</button>
  </nav>
</header>

<div class="container">

  <div class="logo">
    <div class="logo-top">VAULT-TEC CORPORATION // ТЕРМІНАЛ v2.3.1</div>
    <h1>БУНКЕР</h1>
    <p class="subtitle">протокол виживання</p>
    <p class="vault-number">☢ ЛАСКАВО ПРОСИМО ДО СХОВИЩА ☢</p>
  </div>

  <div class="card">
    <h2>Створити кімнату</h2>
    <button class="btn-primary" onclick="createRoom()">Ініціалізувати сховище</button>
    <div class="error-msg" id="create-error"></div>
  </div>

  <div class="divider">// або //</div>

  <div class="card">
    <h2>Приєднатись</h2>
    <div class="input-group">
      <label>Код доступу до сховища</label>
      <input type="text" id="join-code" placeholder="XXXXXX" maxlength="6" autocomplete="off">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Запит на доступ</button>
    <div class="error-msg" id="join-error"></div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
<script>
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/auth';
}
</script>
</body>
</html>
