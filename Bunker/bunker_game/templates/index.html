<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAULT-TEC // БУНКЕР</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
</head>
<body class="has-header">

<!-- HEADER -->
<header class="site-header">
  <a href="/" class="header-logo">
    <span class="logo-badge">☢</span>
    <div>
      <div class="logo-corp">VAULT-TEC CORPORATION</div>
      <div class="logo-name">БУНКЕР</div>
    </div>
  </a>
  <nav class="header-nav">
    <a href="/" class="nav-link active">🏠 ГОЛОВНА</a>
    <a href="/rules" class="nav-link">📖 ПРАВИЛА</a>
    <a href="/about" class="nav-link">ℹ ПРО ГРУ</a>
    <div class="nav-sep"></div>
    <span class="nav-user">// мешканець: <span>{{ username }}</span></span>
    <button class="nav-logout" onclick="doLogout()">ВИЙТИ</button>
  </nav>
</header>

<div class="container">

  <div class="logo">
    <div class="logo-top">VAULT-TEC CORPORATION // ТЕРМІНАЛ v2.3.1</div>
    <h1>БУНКЕР</h1>
    <p class="subtitle">протокол виживання</p>
    <p class="vault-number">☢ ЛАСКАВО ПРОСИМО ДО СХОВИЩА ☢</p>
  </div>

  <div class="card">
    <h2>Створити кімнату</h2>
    <button class="btn-primary" onclick="createRoom()">Ініціалізувати сховище</button>
    <div class="error-msg" id="create-error"></div>
  </div>

  <div class="divider">// або //</div>

  <div class="card">
    <h2>Приєднатись</h2>
    <div class="input-group">
      <label>Код доступу до сховища</label>
      <input type="text" id="join-code" placeholder="XXXXXX" maxlength="6" autocomplete="off">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Запит на доступ</button>
    <div class="error-msg" id="join-error"></div>
  </div>

</div>

<!-- ── GAME OVER POPUP ── -->
<div id="gameover-popup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:center;justify-content:center">
  <div style="background:#0a0a0a;border:1px solid var(--border, #1a2a1a);padding:2.5rem 2rem;max-width:480px;width:90%;font-family:'Share Tech Mono',monospace;text-align:center">
    <div id="go-title" style="font-size:2rem;letter-spacing:.2em;margin-bottom:.5rem"></div>
    <div id="go-sub"   style="font-size:.7rem;color:#6b8c6b;letter-spacing:.1em;margin-bottom:1.5rem"></div>
    <div id="go-list"  style="margin-bottom:1.2rem"></div>
    <div id="go-summary" style="font-size:.65rem;color:#4a6b4a;margin-bottom:1.2rem"></div>
    <div id="go-story" style="display:none;text-align:left;font-size:.65rem;color:#a0b89a;line-height:1.7;border-top:1px solid #1a2a1a;padding-top:1rem;margin-bottom:1.5rem;white-space:pre-wrap;max-height:220px;overflow-y:auto"></div>
    <button onclick="closeGameoverPopup()"
      style="background:none;border:1px solid #2a4a2a;color:#4caf50;font-family:inherit;font-size:.7rem;letter-spacing:.15em;padding:8px 28px;cursor:pointer">
      [ ЗАКРИТИ ]
    </button>
  </div>
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
<script>
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/auth';
}
</script>
</body>
</html>
