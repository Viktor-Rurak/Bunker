<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУНКЕР — Кімната</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root {
  --red: #c0392b; --orange: #e67e22; --dark: #080808;
  --panel: #101010; --panel2: #161616; --border: #222;
  --text: #e8e0d0; --muted: #555; --green: #27ae60;
  --blue: #2980b9;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--dark); color:var(--text); font-family:'Share Tech Mono',monospace; min-height:100vh; }

body::before {
  content:''; position:fixed; inset:0;
  background-image: linear-gradient(rgba(192,57,43,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(192,57,43,0.03) 1px,transparent 1px);
  background-size:40px 40px; pointer-events:none;
}

/* ── HEADER ── */
.header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.8rem 1.5rem; border-bottom:1px solid var(--border);
  background:var(--panel); position:sticky; top:0; z-index:100;
}
.header-logo { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:0.15em; color:var(--red); }
.room-code {
  font-size:0.7rem; letter-spacing:0.3em; color:var(--muted);
  display:flex; align-items:center; gap:0.5rem;
}
.room-code span { color:var(--text); font-size:1rem; cursor:pointer; }
.room-code span:hover { color:var(--orange); }
.round-badge {
  background:var(--red); color:white; font-family:'Bebas Neue',sans-serif;
  padding:0.2rem 0.8rem; font-size:1rem; letter-spacing:0.1em;
}

/* ── LAYOUT ── */
.main { display:grid; grid-template-columns:280px 1fr 280px; gap:1px; background:var(--border); height:calc(100vh - 53px); overflow:hidden; }
.col { background:var(--dark); overflow-y:auto; }

/* ── PANELS ── */
.panel { background:var(--panel); border-bottom:1px solid var(--border); padding:1rem 1.2rem; }
.panel-title {
  font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:0.2em;
  color:var(--muted); text-transform:uppercase; margin-bottom:0.8rem;
  display:flex; align-items:center; gap:0.5rem;
}
.panel-title::before { content:''; display:block; width:3px; height:1rem; background:var(--red); }

/* ── CATASTROPHE ── */
.catastrophe-name {
  font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:0.1em;
  color:var(--red); margin-bottom:0.5rem; line-height:1.1;
}
.catastrophe-desc { font-size:0.72rem; line-height:1.7; color:#aaa; }

/* ── BUNKER ── */
.bunker-item {
  display:flex; align-items:center; gap:0.6rem;
  font-size:0.78rem; padding:0.3rem 0; border-bottom:1px solid #1a1a1a;
  color:#bbb;
}
.bunker-item:last-child { border-bottom:none; }
.bunker-item .dot { width:5px; height:5px; background:var(--orange); flex-shrink:0; }

/* ── PLAYER CARDS ── */
.players-grid { padding:1rem; display:flex; flex-direction:column; gap:0.8rem; }

.player-card {
  background:var(--panel); border:1px solid var(--border);
  position:relative; overflow:hidden; transition:border-color 0.2s;
}
.player-card.is-me { border-color:rgba(192,57,43,0.4); }
.player-card.kicked { opacity:0.35; }
.player-card.kicked::after {
  content:'ВИГНАНО'; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.3em;
  color:var(--red); background:rgba(0,0,0,0.7); z-index:5;
}

.player-card-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.7rem 1rem; border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.player-name { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:0.1em; }
.player-meta { font-size:0.65rem; color:var(--muted); letter-spacing:0.1em; }
.me-badge {
  font-size:0.6rem; letter-spacing:0.2em; background:var(--red);
  color:white; padding:0.15rem 0.4rem;
}
.host-badge {
  font-size:0.6rem; letter-spacing:0.2em; background:var(--orange);
  color:white; padding:0.15rem 0.4rem;
}

.characteristics { padding:0.8rem 1rem; display:flex; flex-wrap:wrap; gap:0.4rem; }

.char-chip {
  display:flex; align-items:center; gap:0.3rem;
  padding:0.25rem 0.6rem; font-size:0.7rem;
  background:#1a1a1a; border:1px solid var(--border);
  color:var(--text); transition:all 0.3s;
}
.char-chip.hidden-chip {
  background:#111; border-color:#1a1a1a; color:var(--muted);
}
.char-chip .chip-icon { font-size:0.8rem; }
.char-chip .chip-label { color:var(--muted); font-size:0.6rem; }

/* Animation for newly revealed */
@keyframes revealPop {
  0% { transform:scale(0.8); opacity:0; background:#2c1810; border-color:var(--red); }
  50% { transform:scale(1.05); background:#2c1810; border-color:var(--orange); }
  100% { transform:scale(1); }
}
.char-chip.just-revealed { animation:revealPop 0.5s ease forwards; }

/* ── MY CARD ── */
.my-card-panel { padding:1rem; }
.my-card { background:var(--panel); border:1px solid rgba(192,57,43,0.3); }
.my-card-title {
  font-family:'Bebas Neue',sans-serif; font-size:1rem; letter-spacing:0.2em;
  color:var(--red); padding:0.7rem 1rem; border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.my-char-list { padding:0.5rem; }
.my-char {
  display:flex; align-items:center; gap:0.8rem;
  padding:0.5rem 0.5rem; border-bottom:1px solid #1a1a1a;
  font-size:0.8rem; cursor:pointer; transition:background 0.15s;
  position:relative;
}
.my-char:hover:not(.revealed):not(.locked) { background:rgba(192,57,43,0.08); }
.my-char:last-child { border-bottom:none; }
.my-char .char-icon { font-size:1rem; width:24px; text-align:center; flex-shrink:0; }
.my-char .char-info { flex:1; }
.my-char .char-name { color:var(--muted); font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; }
.my-char .char-value { color:var(--text); margin-top:0.1rem; }
.my-char .char-status { font-size:0.65rem; letter-spacing:0.1em; flex-shrink:0; }
.my-char.revealed .char-status { color:var(--muted); }
.my-char.can-reveal { }
.my-char.can-reveal .char-status { color:var(--orange); }
.my-char.locked .char-status { color:#333; }
.my-char.revealed { opacity:0.6; }

.reveal-hint {
  font-size:0.65rem; color:var(--orange); letter-spacing:0.15em;
  padding:0.5rem 1rem; border-top:1px solid var(--border);
  text-align:center;
}
.reveal-counter {
  font-size:0.7rem; padding:0.5rem 1rem; text-align:center;
  color:var(--muted); letter-spacing:0.1em;
}
.reveal-counter span { color:var(--orange); }

/* ── LOBBY ── */
#lobby-screen {
  position:fixed; inset:0; background:var(--dark); z-index:200;
  display:flex; align-items:center; justify-content:center;
}
.lobby-box {
  background:var(--panel); border:1px solid var(--border);
  width:100%; max-width:420px; padding:2rem; position:relative;
}
.lobby-box::before {
  content:''; position:absolute; top:0; left:0;
  width:3px; height:100%; background:var(--red);
}
.lobby-title {
  font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:0.15em;
  color:var(--red); margin-bottom:0.3rem;
}
.lobby-code {
  font-size:2.5rem; letter-spacing:0.5em; color:var(--text);
  text-align:center; padding:1rem;
  border:1px solid var(--border); margin:1rem 0;
  background:#0a0a0a; cursor:pointer;
}
.lobby-code:hover::after { content:' 📋'; font-size:1rem; }
.lobby-hint { font-size:0.65rem; color:var(--muted); letter-spacing:0.2em; text-align:center; margin-bottom:1.2rem; }
.lobby-players { margin:1rem 0; }
.lobby-player {
  display:flex; align-items:center; gap:0.6rem;
  padding:0.5rem 0; border-bottom:1px solid #1a1a1a;
  font-size:0.85rem;
}
.lobby-player:last-child { border-bottom:none; }
.lobby-player .dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:pulse 1.5s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.lobby-start-btn {
  width:100%; padding:0.9rem; font-family:'Bebas Neue',sans-serif;
  font-size:1.3rem; letter-spacing:0.2em; background:var(--red);
  color:white; border:none; cursor:pointer; margin-top:1rem;
  transition:background 0.15s;
}
.lobby-start-btn:hover { background:#a93226; }
.lobby-start-btn:disabled { background:#333; color:#666; cursor:not-allowed; }
.lobby-waiting { color:var(--muted); font-size:0.75rem; letter-spacing:0.2em; text-align:center; margin-top:1rem; }

/* ── VOTING ── */
#voting-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:300;
  display:none; align-items:center; justify-content:center;
}
#voting-overlay.show { display:flex; }
.voting-box {
  background:var(--panel); border:1px solid var(--red);
  width:100%; max-width:500px; padding:2rem;
}
.voting-title {
  font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:0.15em;
  color:var(--red); margin-bottom:0.3rem; text-align:center;
}
.voting-subtitle { font-size:0.7rem; color:var(--muted); letter-spacing:0.2em; text-align:center; margin-bottom:1.5rem; }
.vote-options { display:flex; flex-direction:column; gap:0.5rem; }
.vote-btn {
  padding:0.8rem 1rem; background:#0f0f0f; border:1px solid var(--border);
  color:var(--text); font-family:'Share Tech Mono',monospace; font-size:0.9rem;
  cursor:pointer; text-align:left; transition:all 0.15s; letter-spacing:0.05em;
}
.vote-btn:hover:not(:disabled) { border-color:var(--red); background:rgba(192,57,43,0.1); }
.vote-btn:disabled { opacity:0.4; cursor:not-allowed; }
.vote-btn.voted { border-color:var(--red); background:rgba(192,57,43,0.15); }
.vote-progress { font-size:0.7rem; color:var(--muted); text-align:center; margin-top:1rem; letter-spacing:0.2em; }

/* ── KICKED RESULT ── */
#kick-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:400;
  display:none; align-items:center; justify-content:center;
}
#kick-overlay.show { display:flex; }
.kick-box { text-align:center; padding:2rem; max-width:400px; }
.kick-big { font-family:'Bebas Neue',sans-serif; font-size:4rem; color:var(--red); letter-spacing:0.2em; }
.kick-name { font-size:1.5rem; color:var(--text); margin:0.5rem 0; }
.kick-votes { font-size:0.75rem; color:var(--muted); margin:1rem 0; }
.kick-continue {
  margin-top:1.5rem; padding:0.8rem 2rem; background:var(--red);
  color:white; font-family:'Bebas Neue',sans-serif; font-size:1.2rem;
  letter-spacing:0.2em; border:none; cursor:pointer;
}

/* ── GAME OVER ── */
#gameover-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.97); z-index:500;
  display:none; align-items:center; justify-content:center; overflow-y:auto;
}
#gameover-overlay.show { display:flex; }
.gameover-box { max-width:600px; width:100%; padding:2rem; text-align:center; }
.gameover-title { font-family:'Bebas Neue',sans-serif; font-size:4rem; letter-spacing:0.2em; margin-bottom:0.3rem; }
.gameover-title.survived { color:var(--green); }
.gameover-title.dead { color:var(--red); }
.gameover-sub { font-size:0.75rem; letter-spacing:0.3em; color:var(--muted); margin-bottom:2rem; }
.survivor-list { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1.5rem; }
.survivor-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.7rem 1rem; background:var(--panel); border:1px solid var(--border);
}
.survivor-item .s-name { font-size:1rem; }
.survivor-item .s-pts { color:var(--orange); font-size:0.85rem; }
.points-summary {
  font-size:0.75rem; color:var(--muted); letter-spacing:0.15em;
  padding:1rem; border:1px solid var(--border); margin-bottom:1.5rem;
}
.points-summary span { color:var(--text); }
.play-again {
  padding:0.9rem 3rem; background:var(--red); color:white;
  font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:0.2em;
  border:none; cursor:pointer;
}

/* ── LOG ── */
.event-log { padding:1rem; }
.log-entry {
  font-size:0.68rem; color:var(--muted); letter-spacing:0.05em;
  padding:0.3rem 0; border-bottom:1px solid #111; line-height:1.5;
}
.log-entry.highlight { color:var(--orange); }
.log-entry.danger { color:var(--red); }

/* scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:#0a0a0a; }
::-webkit-scrollbar-thumb { background:var(--border); }

.tag { font-size:0.6rem; letter-spacing:0.2em; padding:0.1rem 0.4rem; }
.tag-host { background:rgba(230,126,34,0.2); color:var(--orange); }
.tag-me { background:rgba(192,57,43,0.2); color:var(--red); }
</style>
</head>
<body>

<!-- LOBBY -->
<div id="lobby-screen">
  <div class="lobby-box">
    <div class="lobby-title">ОЧІКУВАННЯ ГРАВЦІВ</div>
    <div class="lobby-hint">ПОДІЛІТЬСЯ КОДОМ З ГРАВЦЯМИ</div>
    <div class="lobby-code" id="lobby-code-display" onclick="copyCode()">{{ room_code }}</div>
    <div class="lobby-hint">НАТИСНІТЬ НА КОД ЩОБ СКОПІЮВАТИ</div>
    <div class="lobby-players" id="lobby-player-list"></div>
    <button class="lobby-start-btn" id="start-btn" disabled onclick="startGame()">ПОЧАТИ ГРУ</button>
    <div class="lobby-waiting" id="lobby-status">Підключення...</div>
  </div>
</div>

<!-- VOTING -->
<div id="voting-overlay">
  <div class="voting-box">
    <div class="voting-title">ГОЛОСУВАННЯ</div>
    <div class="voting-subtitle" id="voting-subtitle">КОГО ВИГНАТИ З БУНКЕРА?</div>
    <div class="vote-options" id="vote-options"></div>
    <div class="vote-progress" id="vote-progress"></div>
  </div>
</div>

<!-- KICKED RESULT -->
<div id="kick-overlay">
  <div class="kick-box">
    <div class="kick-big">ВИГНАНО</div>
    <div class="kick-name" id="kick-name"></div>
    <div class="kick-votes" id="kick-votes-detail"></div>
    <button class="kick-continue" onclick="closeKickOverlay()">ПРОДОВЖИТИ →</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-overlay">
  <div class="gameover-box">
    <div class="gameover-title" id="gameover-title">ВИЖИВАННЯ</div>
    <div class="gameover-sub" id="gameover-sub"></div>
    <div class="survivor-list" id="survivor-list"></div>
    <div class="points-summary" id="points-summary"></div>
    <button class="play-again" onclick="location.href='/'">НОВА ГРА</button>
  </div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">БУНКЕР</div>
  <div class="room-code">КОД: <span onclick="copyCode()">{{ room_code }}</span></div>
  <div class="round-badge" id="round-badge">ЛОБІ</div>
</div>

<!-- MAIN LAYOUT -->
<div class="main">

  <!-- LEFT: Info -->
  <div class="col" id="col-left">
    <div class="panel" id="catastrophe-panel" style="display:none">
      <div class="panel-title">Катастрофа</div>
      <div class="catastrophe-name" id="cat-name"></div>
      <div class="catastrophe-desc" id="cat-desc"></div>
    </div>
    <div class="panel" id="bunker-panel" style="display:none">
      <div class="panel-title">Бункер</div>
      <div id="bunker-info"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Журнал</div>
      <div class="event-log" id="event-log"></div>
    </div>
  </div>

  <!-- CENTER: Players -->
  <div class="col">
    <div class="players-grid" id="players-grid"></div>
  </div>

  <!-- RIGHT: My card -->
  <div class="col" id="col-right">
    <div class="my-card-panel" id="my-card-panel" style="display:none">
      <div class="my-card">
        <div class="my-card-title">МОЯ КАРТКА</div>
        <div class="reveal-counter" id="reveal-counter"></div>
        <div class="my-char-list" id="my-char-list"></div>
        <div class="reveal-hint" id="reveal-hint" style="display:none">↑ НАТИСНІТЬ НА ХАРАКТЕРИСТИКУ ЩОБ ВІДКРИТИ</div>
      </div>
    </div>
  </div>

</div>

<script>
const ROOM_CODE = '{{ room_code }}';
const socket = io();

let myName = sessionStorage.getItem('player_name') || 'Гравець';
let mySid = null;
let isHost = false;
let myCard = null;
let revealedByMe = [];
let revealsAllowed = 0;
let revealsThisRound = 0;
let currentRound = 0;
let hasVoted = false;
let gameStarted = false;
let allPlayers = {};

// ── CONNECT ──
socket.on('connect', () => {
  socket.emit('join_room', { code: ROOM_CODE, name: myName });
});

socket.on('error', data => {
  addLog('⚠ ' + data.msg, 'danger');
  if (!gameStarted) {
    document.getElementById('lobby-status').textContent = data.msg;
  }
});

socket.on('joined', data => {
  mySid = data.sid;
  isHost = data.is_host;
  document.getElementById('lobby-status').textContent =
    isHost ? 'Ви хост. Почекайте гравців.' : 'Очікуємо початку гри...';
  if (isHost) {
    document.getElementById('start-btn').disabled = false;
  }
});

socket.on('lobby_update', data => {
  const list = document.getElementById('lobby-player-list');
  list.innerHTML = data.players.map(p => `
    <div class="lobby-player">
      <div class="dot"></div>
      <span>${p.name}</span>
      ${p.is_host ? '<span class="tag tag-host">ХОСТ</span>' : ''}
    </div>
  `).join('');
  const btn = document.getElementById('start-btn');
  if (isHost) btn.disabled = data.players.length < 2;
});

socket.on('player_left', data => {
  addLog(`${data.name} покинув кімнату`, 'highlight');
});

// ── GAME START ──
socket.on('game_started', data => {
  gameStarted = true;
  document.getElementById('lobby-screen').style.display = 'none';

  myCard = data.my_card;
  currentRound = data.round;
  revealsAllowed = data.reveals_this_round;
  revealsThisRound = 0;

  // Show game info
  showGameInfo(data.game_info);
  renderMyCard();
  renderAllPlayers(data.all_players);
  updateRoundBadge();
  addLog('Гра почалась!', 'highlight');
  addLog(`Катастрофа: ${data.game_info.catastrophe.name}`, 'danger');
  addLog(`Раунд 1 — відкрийте ${revealsAllowed} характеристик`, 'highlight');
  document.getElementById('my-card-panel').style.display = 'block';
});

// ── REVEAL ──
socket.on('player_revealed', data => {
  addLog(`${data.name} відкрив: ${data.icon} ${data.label} — ${data.value}`, data.sid === mySid ? 'highlight' : '');

  // Оновлюємо картку гравця
  const card = document.querySelector(`.player-card[data-sid="${data.sid}"]`);
  if (card) {
    const chars = card.querySelector('.characteristics');
    // Видаляємо один закритий чіп
    const hiddenChip = chars.querySelector('.hidden-chip');
    if (hiddenChip) hiddenChip.remove();
    // Додаємо відкритий
    const chip = document.createElement('div');
    chip.className = 'char-chip just-revealed';
    chip.innerHTML = `<span class="chip-icon">${data.icon}</span><div><div class="chip-label">${data.label}</div><div>${data.value}</div></div>`;
    chars.appendChild(chip);
    setTimeout(() => chip.classList.remove('just-revealed'), 600);
  }
});

// ── VOTING ──
socket.on('voting_started', data => {
  hasVoted = false;
  document.getElementById('voting-overlay').classList.add('show');
  document.getElementById('voting-subtitle').textContent = `РАУНД ${data.round} — КОГО ВИГНАТИ?`;

  const opts = document.getElementById('vote-options');
  opts.innerHTML = data.players
    .filter(p => p.sid !== mySid)
    .map(p => `
      <button class="vote-btn" onclick="castVote('${p.sid}', this)">${p.name}</button>
    `).join('');
  document.getElementById('vote-progress').textContent = 'Очікуємо голосів...';
});

socket.on('vote_update', data => {
  document.getElementById('vote-progress').textContent =
    `Проголосувало: ${data.votes_cast} / ${data.votes_needed}`;
});

// ── KICK ──
socket.on('player_kicked', data => {
  document.getElementById('voting-overlay').classList.remove('show');
  document.getElementById('kick-name').textContent = data.name;

  const tallyText = Object.entries(data.tally)
    .map(([name, votes]) => `${name}: ${votes} голос(ів)`)
    .join(' | ');
  document.getElementById('kick-votes-detail').textContent = tallyText;
  document.getElementById('kick-overlay').classList.add('show');

  addLog(`${data.name} вигнано з бункера`, 'danger');

  // Позначаємо гравця як вигнаного
  const card = document.querySelector(`.player-card[data-sid="${data.sid}"]`);
  if (card) card.classList.add('kicked');
});

// ── NEXT ROUND ──
socket.on('round_update', data => {
  currentRound = data.round;
  revealsAllowed = data.reveals_this_round;
  revealsThisRound = 0;
  updateRoundBadge();
  renderAllPlayers(data.all_players);
  renderMyCard();
  addLog(`Раунд ${data.round + 1} — відкрийте ${revealsAllowed} характеристик`, 'highlight');
});

// ── GAME OVER ──
socket.on('game_over', data => {
  const overlay = document.getElementById('gameover-overlay');
  const title = document.getElementById('gameover-title');
  const sub = document.getElementById('gameover-sub');
  const list = document.getElementById('survivor-list');
  const summary = document.getElementById('points-summary');

  overlay.classList.add('show');
  title.textContent = data.survived ? 'ВИЖИЛИ!' : 'ЗАГИНУЛИ';
  title.className = 'gameover-title ' + (data.survived ? 'survived' : 'dead');
  sub.textContent = data.survived
    ? 'Команда набрала достатньо балів для виживання'
    : 'Команда не змогла вижити в бункері';

  list.innerHTML = data.survivors.map((s, i) => `
    <div class="survivor-item">
      <span class="s-name">${i + 1}. ${s.name}</span>
      <span class="s-pts">${s.points} балів</span>
    </div>
  `).join('');

  summary.innerHTML = `Бали команди: <span>${data.total_points}</span> / Поріг бункера: <span>${data.bunker_points}</span>`;
});

// ── ACTIONS ──
function startGame() {
  socket.emit('start_game', { code: ROOM_CODE });
}

function revealCharacteristic(key) {
  if (revealsThisRound >= revealsAllowed) return;
  if (revealedByMe.includes(key)) return;
  socket.emit('reveal_characteristic', { code: ROOM_CODE, key });
  revealedByMe.push(key);
  revealsThisRound++;
  renderMyCard();
}

function castVote(targetSid, btn) {
  if (hasVoted) return;
  hasVoted = true;
  document.querySelectorAll('.vote-btn').forEach(b => { b.disabled = true; });
  btn.classList.add('voted');
  socket.emit('vote', { code: ROOM_CODE, target: targetSid });
}

function closeKickOverlay() {
  document.getElementById('kick-overlay').classList.remove('show');
}

function copyCode() {
  navigator.clipboard.writeText(ROOM_CODE);
  addLog('Код скопійовано в буфер обміну');
}

// ── RENDER ──
function showGameInfo(info) {
  document.getElementById('catastrophe-panel').style.display = 'block';
  document.getElementById('bunker-panel').style.display = 'block';
  document.getElementById('cat-name').textContent = info.catastrophe.name;
  document.getElementById('cat-desc').textContent = info.catastrophe.description;

  const bunkerEl = document.getElementById('bunker-info');
  bunkerEl.innerHTML = `
    <div class="bunker-item"><div class="dot"></div>${info.bunker.size}</div>
    ${info.bunker.items.map(i => `<div class="bunker-item"><div class="dot"></div>${i}</div>`).join('')}
    <div class="bunker-item"><div class="dot"></div>${info.bunker.time}</div>
  `;
}

function renderAllPlayers(players) {
  const grid = document.getElementById('players-grid');
  grid.innerHTML = '';
  players.forEach(p => {
    const totalHidden = p.total_characteristics - p.revealed.length;
    const revealedChips = p.revealed.map(c => `
      <div class="char-chip">
        <span class="chip-icon">${c.icon}</span>
        <div><div class="chip-label">${c.label}</div><div>${c.value}</div></div>
      </div>
    `).join('');
    const hiddenChips = Array(totalHidden).fill(0).map(() =>
      `<div class="char-chip hidden-chip"><span class="chip-icon">?</span><div><div class="chip-label">закрито</div></div></div>`
    ).join('');

    const card = document.createElement('div');
    card.className = `player-card${p.is_me ? ' is-me' : ''}`;
    card.dataset.sid = p.sid;
    card.innerHTML = `
      <div class="player-card-header">
        <div>
          <div class="player-name">${p.name}</div>
        </div>
        <div style="display:flex;gap:0.3rem;align-items:center">
          ${p.is_host ? '<span class="tag tag-host">ХОСТ</span>' : ''}
          ${p.is_me ? '<span class="tag tag-me">ВИ</span>' : ''}
        </div>
      </div>
      <div class="characteristics">${revealedChips}${hiddenChips}</div>
    `;
    grid.appendChild(card);
  });
}

function renderMyCard() {
  if (!myCard) return;
  const list = document.getElementById('my-char-list');
  const canRevealMore = revealsThisRound < revealsAllowed;
  const hint = document.getElementById('reveal-hint');
  const counter = document.getElementById('reveal-counter');

  counter.innerHTML = `Відкрито в цьому раунді: <span>${revealsThisRound}/${revealsAllowed}</span>`;
  hint.style.display = canRevealMore ? 'block' : 'none';

  list.innerHTML = myCard.characteristics.map(c => {
    const isRevealed = revealedByMe.includes(c.key);
    const canReveal = !isRevealed && canRevealMore;
    const statusText = isRevealed ? 'ВІДКРИТО' : canReveal ? 'НАТИСНІТЬ' : 'ЗАКРИТО';
    const cls = isRevealed ? 'revealed' : canReveal ? 'can-reveal' : 'locked';
    return `
      <div class="my-char ${cls}" onclick="${canReveal ? `revealCharacteristic('${c.key}')` : ''}">
        <div class="char-icon">${c.icon}</div>
        <div class="char-info">
          <div class="char-name">${c.label}</div>
          <div class="char-value">${c.value}</div>
        </div>
        <div class="char-status">${statusText}</div>
      </div>
    `;
  }).join('');
}

function updateRoundBadge() {
  document.getElementById('round-badge').textContent = `РАУНД ${currentRound + 1}`;
}

function addLog(text, type = '') {
  const log = document.getElementById('event-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + type;
  const time = new Date().toLocaleTimeString('uk', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  entry.textContent = `[${time}] ${text}`;
  log.prepend(entry);
}
</script>
</body>
</html>
