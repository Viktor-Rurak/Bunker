<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БУНКЕР</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c0392b;
    --orange: #e67e22;
    --dark: #0a0a0a;
    --panel: #111111;
    --border: #2a2a2a;
    --text: #e8e0d0;
    --muted: #666;
    --green: #27ae60;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(192,57,43,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(192,57,43,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 40px 40px; }
  }

  .noise {
    position: fixed;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 2rem;
  }

  .logo {
    text-align: center;
    margin-bottom: 3rem;
  }

  .logo h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 7rem;
    letter-spacing: 0.2em;
    line-height: 1;
    color: var(--text);
    text-shadow: 0 0 60px rgba(192,57,43,0.4);
    position: relative;
  }

  .logo h1::after {
    content: 'БУНКЕР';
    position: absolute;
    inset: 0;
    color: var(--red);
    clip-path: polygon(0 60%, 100% 55%, 100% 65%, 0 70%);
    transform: translateX(3px);
  }

  .logo .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 0.5rem;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2rem;
    position: relative;
    margin-bottom: 1rem;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--red);
  }

  .card h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--red);
    margin-bottom: 1.2rem;
  }

  .input-group {
    margin-bottom: 1rem;
  }

  .input-group label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  input {
    width: 100%;
    background: #0f0f0f;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    padding: 0.7rem 1rem;
    outline: none;
    transition: border-color 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  input:focus {
    border-color: var(--red);
  }

  input::placeholder {
    color: var(--muted);
    font-size: 0.85rem;
  }

  button {
    width: 100%;
    padding: 0.85rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 0.2em;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn-primary {
    background: var(--red);
    color: white;
  }

  .btn-primary:hover {
    background: #a93226;
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--text);
    background: rgba(255,255,255,0.03);
  }

  .divider {
    text-align: center;
    margin: 1.5rem 0;
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    position: relative;
  }

  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: var(--border);
  }

  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .error-msg {
    color: var(--red);
    font-size: 0.75rem;
    margin-top: 0.5rem;
    letter-spacing: 0.05em;
    display: none;
  }

  .error-msg.show { display: block; }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.05) 2px,
      rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }
</style>
</head>
<body>
<div class="noise"></div>
<div class="container">
  <div class="logo">
    <h1>БУНКЕР</h1>
    <p class="subtitle">Гра на виживання</p>
  </div>

  <div class="card">
    <h2>Створити кімнату</h2>
    <div class="input-group">
      <label>Ваше ім'я</label>
      <input type="text" id="create-name" placeholder="Введіть ім'я" maxlength="20">
    </div>
    <button class="btn-primary" onclick="createRoom()">Створити кімнату</button>
    <div class="error-msg" id="create-error"></div>
  </div>

  <div class="divider">або</div>

  <div class="card">
    <h2>Приєднатись</h2>
    <div class="input-group">
      <label>Ваше ім'я</label>
      <input type="text" id="join-name" placeholder="Введіть ім'я" maxlength="20">
    </div>
    <div class="input-group">
      <label>Код кімнати</label>
      <input type="text" id="join-code" placeholder="XXXXXX" maxlength="6">
    </div>
    <button class="btn-secondary" onclick="joinRoom()">Приєднатись</button>
    <div class="error-msg" id="join-error"></div>
  </div>
</div>

<script>
async function createRoom() {
  const name = document.getElementById('create-name').value.trim();
  const err = document.getElementById('create-error');
  err.classList.remove('show');

  if (!name) { err.textContent = 'Введіть ім\'я'; err.classList.add('show'); return; }

  const res = await fetch('/api/create_room', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name})
  });
  const data = await res.json();
  if (data.error) { err.textContent = data.error; err.classList.add('show'); return; }

  // Зберігаємо ім'я і переходимо
  sessionStorage.setItem('player_name', name);
  window.location.href = `/room/${data.code}`;
}

function joinRoom() {
  const name = document.getElementById('join-name').value.trim();
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const err = document.getElementById('join-error');
  err.classList.remove('show');

  if (!name) { err.textContent = 'Введіть ім\'я'; err.classList.add('show'); return; }
  if (code.length !== 6) { err.textContent = 'Код має бути 6 символів'; err.classList.add('show'); return; }

  sessionStorage.setItem('player_name', name);
  window.location.href = `/room/${code}`;
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const focused = document.activeElement;
    if (focused.id.startsWith('create')) createRoom();
    else if (focused.id.startsWith('join')) joinRoom();
  }
});
</script>
</body>
</html>
